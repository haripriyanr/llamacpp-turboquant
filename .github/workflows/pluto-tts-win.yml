name: Pluto TTS Win Bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to'
        required: true
        default: 'v0.1.0'
  push:
    tags:
      - 'pluto-tts-v*'

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

jobs:
  windows-cpu:
    runs-on: windows-2022
    steps:
      - name: Checkout upstream llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master
          fetch-depth: 1
      - name: Install Ninja
        run: choco install ninja -y
      - name: Build CPU
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON %CMAKE_ARGS%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item LICENSE ./build/bin/Release/ -ErrorAction SilentlyContinue
          7z a pluto-tts-cpu-win.zip ./build/bin/Release/*
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: pluto-tts-cpu-win
          path: pluto-tts-cpu-win.zip

  windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout upstream llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master
          fetch-depth: 1
      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
      - name: Install Ninja
        run: choco install ninja -y
      - name: Build CUDA
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DGGML_CUDA_FA_ALL_QUANTS=ON %CMAKE_ARGS%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item LICENSE ./build/bin/Release/ -ErrorAction SilentlyContinue
          $dst='./build/bin/Release/'
          robocopy "$env:CUDA_PATH\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll; if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE=0 }
          robocopy "$env:CUDA_PATH\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll; if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE=0 }
          robocopy "$env:CUDA_PATH\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll; if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE=0 }
          7z a pluto-tts-cuda-win.zip ./build/bin/Release/*
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: pluto-tts-cuda-win
          path: pluto-tts-cuda-win.zip

  windows-vulkan:
    runs-on: windows-2022
    steps:
      - name: Checkout upstream llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master
          fetch-depth: 1
      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y
          echo "VULKAN_SDK=C:\VulkanSDK\$(Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name)" >> $env:GITHUB_ENV
      - name: Install Ninja
        run: choco install ninja -y
      - name: Build Vulkan
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON -DGGML_VULKAN=ON %CMAKE_ARGS%
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item LICENSE ./build/bin/Release/ -ErrorAction SilentlyContinue
          7z a pluto-tts-vulkan-win.zip ./build/bin/Release/*
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: pluto-tts-vulkan-win
          path: pluto-tts-vulkan-win.zip

  release:
    needs: [windows-cpu, windows-cuda, windows-vulkan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release
          merge-multiple: true
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v0.1.0' }}
          files: ./release/*
          fail_on_unmatched_files: true
